<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waves: light and sound — PHY 1020 practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#F4F7FB; --surface:#FFFFFF; --surface-2:#EEF3F9;
  --ink:#132235; --ink-2:#465770; --line:#C3CEDC; --grid:#DCE4EE; --axis:#5B6B82;
  --wave:#1A56C4; --sound:#9A4500; --mark:#A3106F;
  --ok:#14693B; --ok-bg:#E5F4EB; --bad:#AE2318; --bad-bg:#FBEAE8; --warn:#7A5400; --warn-bg:#FFF4D6;
  --focus:#1A56C4; --btn:#132235; --btn-ink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#0E1622; --surface:#152132; --surface-2:#1B2A3F;
    --ink:#E9EFF7; --ink-2:#AEBBCC; --line:#33445C; --grid:#24344A; --axis:#8C9BB0;
    --wave:#86B4FF; --sound:#FFB070; --mark:#FF84CF;
    --ok:#7BDDA4; --ok-bg:#12301F; --bad:#FF9A90; --bad-bg:#3A1714; --warn:#FFD27A; --warn-bg:#33280C;
    --focus:#86B4FF; --btn:#E9EFF7; --btn-ink:#0E1622;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#0E1622; --surface:#152132; --surface-2:#1B2A3F;
  --ink:#E9EFF7; --ink-2:#AEBBCC; --line:#33445C; --grid:#24344A; --axis:#8C9BB0;
  --wave:#86B4FF; --sound:#FFB070; --mark:#FF84CF;
  --ok:#7BDDA4; --ok-bg:#12301F; --bad:#FF9A90; --bad-bg:#3A1714; --warn:#FFD27A; --warn-bg:#33280C;
  --focus:#86B4FF; --btn:#E9EFF7; --btn-ink:#0E1622;
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Atkinson Hyperlegible', Verdana, 'Segoe UI', Arial, sans-serif;
  font-size:1.0625rem; line-height:1.55;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:28px 28px; background-attachment:fixed;
}
.skip{ position:absolute; left:-999px; top:8px; background:var(--btn); color:var(--btn-ink); padding:10px 14px; border-radius:6px; z-index:20; }
.skip:focus{ left:12px; }
.sr-only{ position:absolute!important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
:focus-visible{ outline:3px solid var(--focus); outline-offset:3px; }

.wrap{ max-width:1180px; margin:0 auto; padding:28px 20px 56px; }
header.top{ display:grid; gap:6px; margin-bottom:22px; }
.course{ color:var(--ink-2); font-weight:700; margin:0; }
h1{ font-size:clamp(2rem,5vw,3.1rem); line-height:1.08; margin:0; letter-spacing:-0.01em; }
.title-wave{ width:min(420px,80%); height:26px; display:block; }
.title-wave path{ fill:none; stroke-width:3; stroke-linecap:round; }
.lede{ max-width:68ch; margin:4px 0 0; color:var(--ink-2); }

.layout{ display:grid; grid-template-columns:270px minmax(0,1fr); gap:22px; align-items:start; }
nav.qnav{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px; position:sticky; top:calc(12px + env(safe-area-inset-top,0px)); }
nav.qnav h2{ font-size:1rem; margin:6px 8px 8px; }
nav.qnav ol{ list-style:none; margin:0; padding:0; display:grid; gap:4px; }
nav.qnav a{
  display:grid; grid-template-columns:2rem 1fr; gap:8px; align-items:start;
  padding:8px 8px; border-radius:7px; color:var(--ink); text-decoration:none; min-height:44px;
}
nav.qnav a:hover{ background:var(--surface-2); }
nav.qnav a[aria-current="page"]{ background:var(--surface-2); box-shadow:inset 3px 0 0 var(--wave); }
.qn{ font-weight:700; display:inline-grid; place-items:center; width:2rem; height:2rem; border-radius:50%; border:2px solid var(--line); font-size:.95rem; }
.qtxt{ font-size:.95rem; line-height:1.3; }
.qstat{ display:block; font-size:.82rem; color:var(--ink-2); margin-top:2px; }
.qstat.ok{ color:var(--ok); } .qstat.bad{ color:var(--bad); } .qstat.part{ color:var(--warn); }
.group-label{ font-size:.82rem; color:var(--ink-2); margin:10px 8px 2px; font-weight:700; }

main{ min-width:0; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:clamp(16px,3vw,28px); }
.qhead{ display:flex; flex-wrap:wrap; gap:6px 14px; align-items:baseline; margin-bottom:6px; }
.qhead .count{ color:var(--ink-2); font-weight:700; }
.qhead .pts{ color:var(--ink-2); }
.tag{ font-size:.85rem; font-weight:700; padding:2px 10px; border-radius:999px; border:1.5px solid currentColor; }
.tag.light{ color:var(--wave); } .tag.sound{ color:var(--sound); } .tag.mech{ color:var(--ink-2); }
h2.qtitle{ font-size:clamp(1.4rem,3vw,1.85rem); line-height:1.2; margin:0 0 10px; }
h2.qtitle:focus{ outline:none; }
h2.qtitle:focus-visible{ outline:3px solid var(--focus); }
.intro{ max-width:72ch; margin:0 0 14px; }
.given{ display:inline-block; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:6px 12px; font-weight:700; margin-bottom:14px; }

.figure{ border:1px solid var(--line); border-radius:10px; background:var(--surface); padding:8px; margin:0 0 14px; }
.figure svg{ display:block; width:100%; height:auto; }
.drawzone{ touch-action:none; cursor:crosshair; }
svg text{ font-family:'Atkinson Hyperlegible', Verdana, Arial, sans-serif; fill:var(--ink-2); }
.figcap{ font-size:.92rem; color:var(--ink-2); margin:6px 4px 2px; }

.controls{ display:flex; flex-wrap:wrap; gap:10px; margin:6px 0 14px; }
button{
  font:inherit; font-weight:700; min-height:44px; padding:8px 16px; border-radius:8px; cursor:pointer;
  border:2px solid var(--ink); background:transparent; color:var(--ink);
}
button:hover{ background:var(--surface-2); }
button.primary{ background:var(--btn); color:var(--btn-ink); border-color:var(--btn); }
button.primary:hover{ filter:brightness(1.15); }
button:disabled{ opacity:.5; cursor:not-allowed; }

.help{ font-size:.93rem; color:var(--ink-2); max-width:72ch; margin:0 0 12px; }
kbd{ font-family:inherit; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 5px; background:var(--surface-2); }

.feedback{ border-radius:8px; padding:12px 14px; margin-top:6px; border:1.5px solid transparent; max-width:76ch; }
.feedback:empty{ display:none; }
.feedback.ok{ background:var(--ok-bg); border-color:var(--ok); }
.feedback.bad{ background:var(--bad-bg); border-color:var(--bad); }
.feedback.part{ background:var(--warn-bg); border-color:var(--warn); }
.feedback strong{ display:block; margin-bottom:2px; }

.fields{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin:4px 0 12px; }
.field label{ display:block; font-weight:700; margin-bottom:4px; }
.inrow{ display:flex; align-items:stretch; border:2px solid var(--axis); border-radius:8px; background:var(--surface); overflow:hidden; }
.inrow:focus-within{ outline:3px solid var(--focus); outline-offset:2px; }
.inrow input{ flex:1; min-width:0; font:inherit; font-size:1.1rem; padding:8px 10px; border:0; background:transparent; color:var(--ink); }
.inrow input:focus{ outline:none; }
.unit{ display:grid; place-items:center; padding:0 12px; background:var(--surface-2); color:var(--ink-2); font-weight:700; border-left:1px solid var(--line); }
.fres{ font-size:.92rem; margin-top:5px; min-height:1.2em; }
.fres.ok{ color:var(--ok); } .fres.bad{ color:var(--bad); }
.field.is-ok .inrow{ border-color:var(--ok); } .field.is-bad .inrow{ border-color:var(--bad); }

fieldset.choices{ border:0; padding:0; margin:0 0 12px; }
fieldset.choices legend{ font-weight:700; margin-bottom:8px; padding:0; }
.choice{ display:flex; gap:12px; align-items:center; border:2px solid var(--line); border-radius:9px; padding:10px 14px; margin-bottom:8px; cursor:pointer; max-width:420px; min-height:48px; }
.choice:hover{ border-color:var(--axis); }
.choice:has(input:checked){ border-color:var(--ink); background:var(--surface-2); }
.choice input{ width:1.25rem; height:1.25rem; accent-color:var(--wave); }
.choice .sub{ display:block; font-size:.88rem; color:var(--ink-2); }

details.data{ margin:0 0 14px; }
details.data summary{ cursor:pointer; font-weight:700; color:var(--ink); padding:10px 0; }
.tablewrap{ overflow-x:auto; max-height:320px; overflow-y:auto; border:1px solid var(--line); border-radius:8px; }
table{ border-collapse:collapse; width:100%; font-size:.95rem; }
th,td{ padding:6px 12px; text-align:right; border-bottom:1px solid var(--line); }
th{ background:var(--surface-2); position:sticky; top:0; }
caption{ text-align:left; padding:8px 12px; color:var(--ink-2); font-size:.9rem; }

.pager{ display:flex; justify-content:space-between; gap:10px; margin-top:22px; flex-wrap:wrap; }
.pager a{ display:inline-flex; align-items:center; min-height:44px; padding:8px 16px; border-radius:8px; border:2px solid var(--ink); color:var(--ink); text-decoration:none; font-weight:700; }
.pager a:hover{ background:var(--surface-2); }
.pager a.next{ background:var(--btn); color:var(--btn-ink); border-color:var(--btn); margin-left:auto; }

.statement{ margin:0 0 18px; padding:14px 18px; border-left:5px solid var(--wave); background:var(--surface-2); border-radius:0 8px 8px 0; font-size:1.2rem; font-weight:700; max-width:60ch; }
.choice.student{ max-width:680px; align-items:flex-start; padding:14px 16px; }
.choice.student input{ margin-top:.6rem; flex:none; }
.avatar{ flex:none; display:grid; place-items:center; width:2.4rem; height:2.4rem; border-radius:50%; background:var(--surface-2); border:2px solid var(--axis); color:var(--ink); font-weight:700; }
.sname{ display:block; font-weight:700; }
.quote{ display:block; }
.whylist{ margin:6px 0 0; padding-left:1.1rem; }
.whylist li{ margin-bottom:6px; }
.ranklist{ list-style:none; margin:0 0 6px; padding:0; display:grid; gap:8px; max-width:680px; }
.rankitem{ display:flex; align-items:center; gap:14px; border:2px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--surface); }
.rankitem.is-ok{ border-color:var(--ok); } .rankitem.is-bad{ border-color:var(--bad); }
.rpos{ flex:none; display:grid; place-items:center; width:2.2rem; height:2.2rem; border-radius:50%; background:var(--btn); color:var(--btn-ink); font-weight:700; }
.rbody{ flex:1; min-width:0; }
.rlabel{ display:block; font-weight:700; }
.rdetail{ display:block; color:var(--ink-2); }
.rmark{ display:block; font-size:.9rem; font-weight:700; }
.rmark.ok{ color:var(--ok); } .rmark.bad{ color:var(--bad); }
.rbtns{ flex:none; display:flex; gap:6px; }
button.mv{ padding:6px 10px; font-size:.92rem; }
.rank-end{ font-weight:700; color:var(--ink-2); margin:4px 0 8px; }
@media (max-width:520px){ .rankitem{ flex-wrap:wrap; } .rbtns{ width:100%; } .rbtns button{ flex:1; } }
.fill-box{ background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin:0 0 14px; max-width:760px; }
.fill-sentence{ margin:0; font-size:1.2rem; line-height:2.6; }
.blank{ display:inline-flex; align-items:center; gap:4px; white-space:nowrap; line-height:1.2; vertical-align:middle; }
.bmark:empty{ display:none; }
.bnum{ display:inline-grid; place-items:center; width:1.4rem; height:1.4rem; border-radius:50%; background:var(--btn); color:var(--btn-ink); font-size:.8rem; font-weight:700; }
.blank select{ font:inherit; font-size:1.05rem; font-weight:700; color:var(--ink); background:var(--surface); border:2px solid var(--axis); border-radius:8px; padding:4px 8px; min-height:44px; max-width:100%; }
.blank.is-ok select{ border-color:var(--ok); } .blank.is-bad select{ border-color:var(--bad); }
.bmark{ font-weight:700; min-width:1ch; }
.blank.is-ok .bmark{ color:var(--ok); } .blank.is-bad .bmark{ color:var(--bad); }
.sliders{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 24px; margin:4px 0 8px; max-width:760px; }
.slider label{ display:block; font-weight:700; margin-bottom:6px; }
.sval{ display:inline-block; min-width:5.5rem; padding:1px 8px; margin-left:4px; border-radius:6px; background:var(--surface-2); border:1px solid var(--line); color:var(--sound); }
.slider input[type=range]{ width:100%; height:44px; accent-color:var(--sound); cursor:pointer; }
@media (max-width:560px){ .sliders{ grid-template-columns:1fr; } }
.summary-table td:first-child, .summary-table th:first-child{ text-align:left; }
.score{ font-size:2.2rem; font-weight:700; margin:0; }

/* attempts, reveal, start, celebration */
.teamline{ margin:2px 0 0; color:var(--ink); font-weight:700; }
.teamline a{ color:var(--wave); font-weight:400; margin-left:6px; }
.tries{ display:flex; align-items:center; gap:10px; margin:0 0 10px; color:var(--ink-2); font-weight:700; }
.pips{ display:inline-flex; gap:5px; }
.pip{ width:.8rem; height:.8rem; border-radius:50%; border:2px solid var(--axis); }
.pip.used{ background:var(--axis); }
.reveal{ margin-top:14px; border:2px solid var(--wave); border-radius:10px; padding:14px 18px; background:var(--surface-2); max-width:76ch; }
.reveal h3{ margin:0 0 6px; font-size:1.15rem; }
.reveal p{ margin:6px 0; }
.reveal ol, .reveal ul{ margin:6px 0; padding-left:1.3rem; }
.reveal li{ margin-bottom:4px; }
.reveal .ans{ font-weight:700; }
input:disabled, select:disabled, button:disabled{ cursor:not-allowed; }
.choice:has(input:disabled){ cursor:default; }
.inrow:has(input:disabled){ background:var(--surface-2); }

.start .namefield{ margin-bottom:16px; max-width:420px; }
.start label{ display:block; font-weight:700; margin-bottom:4px; }
.start .opt{ font-weight:400; color:var(--ink-2); }
.start input[type=text]{ width:100%; font:inherit; font-size:1.1rem; padding:10px 12px; border:2px solid var(--axis); border-radius:8px; background:var(--surface); color:var(--ink); min-height:48px; }
.start input[aria-invalid="true"]{ border-color:var(--bad); }
.start .err{ color:var(--bad); font-weight:700; margin:4px 0 0; min-height:1.2em; }
.rules{ margin:18px 0 0; padding:14px 18px 14px 34px; background:var(--surface-2); border-radius:10px; border:1px solid var(--line); max-width:62ch; }
.rules li{ margin-bottom:4px; }

.celebrate{ position:relative; overflow:hidden; text-align:center; border:3px solid var(--wave); padding:clamp(22px,5vw,44px) clamp(16px,4vw,40px); margin-bottom:22px; }
.celebrate .kicker{ font-weight:700; color:var(--ink-2); margin:0; }
.celebrate h2{ font-size:clamp(1.8rem,5vw,2.8rem); line-height:1.1; margin:8px 0 6px; }
.celebrate h2:focus{ outline:none; } .celebrate h2:focus-visible{ outline:3px solid var(--focus); }
.celebrate .bigscore{ font-size:clamp(3rem,10vw,5rem); font-weight:700; line-height:1; margin:14px 0 0; color:var(--wave); }
.celebrate .outof{ margin:2px 0 14px; color:var(--ink-2); font-weight:700; }
.celebrate .msg{ font-size:1.15rem; max-width:52ch; margin:0 auto 14px; }
.celebrate .stats{ display:flex; justify-content:center; flex-wrap:wrap; gap:10px 28px; margin:10px 0 6px; }
.celebrate .stat b{ display:block; font-size:1.6rem; }
.celebrate .stat span{ color:var(--ink-2); }
.celebrate .date{ color:var(--ink-2); margin:10px 0 0; }
.celebrate .cwave{ width:min(520px,90%); height:34px; display:block; margin:6px auto 0; }
.celebrate .cwave path{ fill:none; stroke-width:4; stroke-linecap:round; }
.confetti{ position:absolute; inset:0; pointer-events:none; }
.confetti i{ position:absolute; top:-20px; width:10px; height:16px; border-radius:3px; opacity:0; animation:fall 2.6s ease-in forwards; }
@keyframes fall{ 0%{ transform:translateY(0) rotate(0); opacity:1; } 85%{ opacity:1; } 100%{ transform:translateY(560px) rotate(540deg); opacity:0; } }
@media (prefers-reduced-motion: reduce){ .confetti{ display:none; } }
.todo{ text-align:left; max-width:52ch; margin:10px auto 0; }

h2[tabindex="-1"]:focus, h2[tabindex="-1"]:focus-visible{ outline:none; }
.reveal:focus{ outline:none; }
a{ color:var(--wave); }
.summary-table td:nth-child(2), .summary-table th:nth-child(2){ text-align:left; }
.reveal th:first-child{ text-align:left; }

@media (max-width:560px){ .fields{ grid-template-columns:1fr; } }
@media (max-width:880px){
  .layout{ grid-template-columns:1fr; }
  nav.qnav{ position:static; }
  nav.qnav ol{ grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
  .group-label{ grid-column:1/-1; }
}
@media (prefers-reduced-motion: reduce){ *{ scroll-behavior:auto!important; } }
@media print{
  body{ background:none; } nav.qnav, .controls, .pager{ display:none; }
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the question</a>
<div class="wrap">
  <header class="top">
    <p class="course">PHY 1020, Activity 19 practice</p>
    <h1>Waves: light and sound</h1>
    <svg class="title-wave" viewBox="0 0 420 26" aria-hidden="true" focusable="false">
      <path d="M2 13 C 22 -3, 42 -3, 62 13 S 102 29, 122 13 S 162 -3, 182 13 S 222 29, 242 13" style="stroke:var(--wave)"/>
      <path d="M242 13 C 252 5, 262 5, 272 13 S 292 21, 302 13 S 322 5, 332 13 S 352 21, 362 13 S 382 5, 392 13 S 412 21, 418 13" style="stroke:var(--sound)"/>
    </svg>
    <p class="teamline" id="teamline" hidden></p>
    <p class="lede">Draw on moving waves, read values off graphs, and watch how particles move in different kinds of waves. Check each answer as you go. Everything works with a keyboard: use <kbd>Tab</kbd> to move between controls.</p>
  </header>

  <div class="layout">
    <nav class="qnav" aria-label="Questions">
      <h2>Questions</h2>
      <ol id="navlist"></ol>
    </nav>
    <main id="main" tabindex="-1">
      <div id="stage"></div>
    </main>
  </div>
</div>
<div id="announcer" class="sr-only" aria-live="polite"></div>

<script>
(function(){
"use strict";
const NS = "http://www.w3.org/2000/svg";
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const TAU = Math.PI*2;
const PTS=5, MAX_TRIES=3, STORE="phy1020-waves-activity19-v2";

function S(tag, attrs, parent){ const e=document.createElementNS(NS,tag); if(attrs) for(const k in attrs) e.setAttribute(k, attrs[k]); if(parent) parent.appendChild(e); return e; }
function H(tag, attrs, ...kids){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v=attrs[k];
    if(k==="class") e.className=v;
    else if(k==="text") e.textContent=v;
    else if(k==="html") e.innerHTML=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  kids.forEach(c=>{ if(c!=null) e.append(c); });
  return e;
}
const announcer=document.getElementById("announcer");
let annT=null;
function announce(msg, delay){ clearTimeout(annT); annT=setTimeout(()=>{ announcer.textContent=""; setTimeout(()=>{announcer.textContent=msg;},30); }, delay||0); }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const near=(v,target,tol)=>Math.abs(v-target)<=Math.abs(target)*tol;
function fmtPts(v){ return String(Number(v.toFixed(2))); }
function trimNum(v){ return String(Number(v.toPrecision(6))); }
const SUP={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
function nice(v){
  const a=Math.abs(v); if(a===0) return "0";
  if(a>=1e-3 && a<1e5) return trimNum(Number(v.toPrecision(3)));
  let e=Math.floor(Math.log10(a)); let m=Number((v/Math.pow(10,e)).toPrecision(3));
  if(Math.abs(m)>=10){ m=Number((m/10).toPrecision(3)); e+=1; }
  return m+" × 10"+String(e).split("").map(c=>SUP[c]).join("");
}
function parseNum(raw){
  if(raw==null) return NaN;
  let s=String(raw).trim().replace(/−/g,"-").replace(/,/g,"").replace(/\s+/g,"");
  s=s.replace(/[×xX*·]10\^?\(?([+-]?\d+)\)?/,"e$1");
  s=s.replace(/^10\^([+-]?\d+)/,"1e$1");
  const m=s.match(/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i);
  return m? parseFloat(m[0]) : NaN;
}
function triesWord(n){ return n+" "+(n===1?"attempt":"attempts"); }

/* ---------------- Question bank ---------------- */
const QUESTIONS=[
  { id:"q1", group:"Draw on the wave", type:"arrow", kind:"amplitude", tag:"light",

/* ---------------- State and saving ---------------- */
const team={names:["",""]};
const state={};
function freshState(){ QUESTIONS.forEach(q=>{ state[q.id]={earned:0, max:PARTS[q.type]||1, tries:0, locked:false, success:false}; }); }
freshState();
function save(){ try{ localStorage.setItem(STORE, JSON.stringify({names:team.names, state})); }catch(e){} }
function load(){
  try{
    const raw=localStorage.getItem(STORE); if(!raw) return;
    const d=JSON.parse(raw);
    if(d && Array.isArray(d.names)) team.names=[String(d.names[0]||""),String(d.names[1]||"")];
    if(d && d.state) for(const id in state){ const s=d.state[id]; if(s) Object.assign(state[id],{earned:+s.earned||0,tries:+s.tries||0,locked:!!s.locked,success:!!s.success}); }
  }catch(e){}
}
load();
function namesText(){ const n=team.names.filter(Boolean); return n.length===2? n[0]+" and "+n[1] : (n[0]||""); }

/* ---------------- Navigation ---------------- */
const navlist=document.getElementById("navlist");

const teamline=document.getElementById("teamline");
const views={};
let current=null;

function statusText(id){
  const s=state[id]; const pts=fmtPts(PTS*s.earned/s.max);
  if(s.locked) return s.success? {t:"✓ "+pts+" of "+PTS+" points", c:"ok"} : {t:"Done: "+pts+" of "+PTS+" points", c:s.earned>0?"part":"bad"};
  if(s.tries>0){ const left=MAX_TRIES-s.tries; return {t:(s.earned>0?"◐ ":"✗ ")+triesWord(left)+" left", c:s.earned>0?"part":"bad"}; }
  return {t:"Not answered", c:""};
}
function buildNav(){
  navlist.innerHTML="";
  navlist.append(H("li",null,H("a",{href:"#start",id:"nav-start"},
    H("span",{class:"qn","aria-hidden":"true",text:"✎"}), H("span",{class:"qtxt",text:"Your names"}))));
  let lastGroup=null;
  QUESTIONS.forEach((q,i)=>{
    if(q.group!==lastGroup){ navlist.append(H("li",{class:"group-label","aria-hidden":"true",text:q.group})); lastGroup=q.group; }
    const st=statusText(q.id);
    navlist.append(H("li",null,H("a",{href:"#"+q.id, id:"nav-"+q.id},
      H("span",{class:"qn","aria-hidden":"true",text:String(i+1)}),
      H("span",{class:"qtxt"},
        H("span",{class:"sr-only",text:"Question "+(i+1)+": "}),
        document.createTextNode(q.short),
        H("span",{class:"qstat "+st.c, text:st.t})))));
  });
  navlist.append(H("li",{class:"group-label","aria-hidden":"true",text:"Finish"}));
  navlist.append(H("li",null,H("a",{href:"#summary",id:"nav-summary"},
    H("span",{class:"qn","aria-hidden":"true",text:"★"}), H("span",{class:"qtxt",text:"Results card"}))));
  markCurrent();
}
function refreshNavStatus(id){
  const a=document.getElementById("nav-"+id); if(!a) return;
  const st=statusText(id); const el=a.querySelector(".qstat");
  el.className="qstat "+st.c; el.textContent=st.t;
}
function markCurrent(){
  navlist.querySelectorAll("a").forEach(a=>a.removeAttribute("aria-current"));

}

/* ---------------- Attempts ---------------- */
function attempts(q){
  const st=state[q.id];
  const info=H("p",{class:"tries"});
  const reveal=H("div",{class:"reveal",hidden:"",tabindex:"-1"});
  function render(){
    info.innerHTML="";
    const pips=H("span",{class:"pips","aria-hidden":"true"});
    for(let n=0;n<MAX_TRIES;n++) pips.append(H("span",{class:"pip"+(n<st.tries?" used":"")}));
    let txt;
    if(st.locked) txt= st.success? "Solved on attempt "+st.tries+" of "+MAX_TRIES+"." : "All "+MAX_TRIES+" attempts used.";
    else txt="Attempts left: "+(MAX_TRIES-st.tries)+" of "+MAX_TRIES;
    info.append(pips, document.createTextNode(txt));
  }
  render();
  return {
    info, reveal,
    get locked(){ return st.locked; },
    get left(){ return MAX_TRIES-st.tries; },
    record(success, earned){
      st.tries++; st.earned=earned;
      if(success || st.tries>=MAX_TRIES){ st.locked=true; st.success=success; }
      st.status=1; render(); save(); refreshNavStatus(q.id);
      return st.locked;
    },
    show(nodes){
      reveal.innerHTML="";
      reveal.append(H("h3",{text:"Answer and explanation"}));
      nodes.forEach(n=>reveal.append(typeof n==="string"? H("p",{text:n}) : n));
      reveal.hidden=false;
    }
  };
}
function retryText(att){ return " You have "+triesWord(att.left)+" left."; }
const LAST=" That was your last attempt. Read the answer and explanation below.";

/* ---------------- Shared plotting ---------------- */
function plotFrame(o){
  const X=x=>o.l+(x/o.xMax)*(o.r-o.l);
  const Y=y=>(o.t+o.b)/2-(y/o.yMax)*((o.b-o.t)/2);
  const iX=px=>(px-o.l)/(o.r-o.l)*o.xMax;
  const iY=py=>((o.t+o.b)/2-py)/((o.b-o.t)/2)*o.yMax;
  return {X,Y,iX,iY};
}
function dataTable(q, fn, step, capText, yDec){
  const tbl=H("table");
  tbl.append(H("caption",{text:capText}));
  const thead=H("thead",null,H("tr",null,H("th",{scope:"col",text:q.xName}),H("th",{scope:"col",text:q.yName})));
  const tb=H("tbody");
  const n=Math.round(q.xMax/step);
  for(let i=0;i<=n;i++){
    const x=i*step; let y=fn(x); if(Math.abs(y)<1e-9) y=0;
    tb.append(H("tr",null,H("td",{text:trimNum(x)}),H("td",{text:y.toFixed(yDec)})));
  }
  tbl.append(thead,tb);
  return tbl;
}
function gridPlot(svg,q,o,P){
  const nx=Math.round(q.xMax/q.xStep), ny=Math.round(q.yMax/q.yStep);
  for(let n=0;n<=nx;n++){
    const x=n*q.xStep, px=P.X(x);
    S("line",{x1:px,x2:px,y1:o.t,y2:o.b,style:"stroke:var(--grid)","stroke-width":1.2},svg);
    if(n%q.xLabelEvery===0){ const tx=S("text",{x:px,y:o.b+22,"text-anchor":"middle","font-size":15},svg); tx.textContent=trimNum(Number(x.toFixed(4))); }
  }
  for(let n=-ny;n<=ny;n++){
    const y=n*q.yStep, py=P.Y(y);
    S("line",{x1:o.l,x2:o.r,y1:py,y2:py,style:"stroke:"+(n===0?"var(--axis)":"var(--grid)"),"stroke-width":n===0?2:1.2},svg);
    if(n%q.yLabelEvery===0){ const ty=S("text",{x:o.l-8,y:py+5,"text-anchor":"end","font-size":15},svg); ty.textContent=trimNum(Number(y.toFixed(4))); }
  }
  S("rect",{x:o.l,y:o.t,width:o.r-o.l,height:o.b-o.t,fill:"none",style:"stroke:var(--axis)","stroke-width":1.5},svg);
  const xl=S("text",{x:(o.l+o.r)/2,y:o.b+54,"text-anchor":"middle","font-size":17,style:"fill:var(--ink)"},svg); xl.textContent=q.xName;

  function placeGhost(){

  }

    if(att.locked) return;
    if(!arrow){ setFeedback(fb,"bad","No arrow yet.","Press and drag on the graph, or choose Add arrow, to draw one. This didn’t use an attempt."); return; }
    const A=q.A;
    const dx=Math.abs(arrow.x2-arrow.x1), dy=Math.abs(arrow.y2-arrow.y1);
    let ok=false, msg="";
    if(q.kind==="amplitude"){
      const lo=Math.min(Math.abs(arrow.y1),Math.abs(arrow.y2)), hi=Math.max(Math.abs(arrow.y1),Math.abs(arrow.y2));
      const oppSides = Math.sign(arrow.y1)!==Math.sign(arrow.y2);

      else if(oppSides && near(dy,2*A,0.15)) msg="You measured from a crest down to a trough. That is twice the amplitude.";
      else if(lo>0.14*A) msg="Start one end of the arrow on the rest position, the dashed middle line.";

      else { ok=true; msg="The amplitude goes from the rest position to a crest."; }
    } else {
      if(dy>0.16*A) msg="Wavelength is a distance along the direction the wave travels. Draw your arrow horizontally.";
      else if(near(dx,lam/2,0.12)) msg="That’s only half a wavelength.";
      else if(near(dx,2*lam,0.08)) msg="That arrow spans two wavelengths.";
      else if(near(dx,lam,0.07)){ ok=true; msg="One wavelength is one full cycle, such as crest to crest."; }
      else msg="Your arrow is "+fmtX(dx)+" long. Make it span exactly one full cycle of the wave.";
    }
    const locked=att.record(ok, ok?1:0);
    if(ok) setFeedback(fb,"ok","✓ Correct.",msg);
    else setFeedback(fb,"bad","✗ Not quite.", msg+(locked?LAST:retryText(att)));
    if(locked) lock();
  });

  setPlaying(playing); drawWave();
  if(att.locked){ lock(); }
  return { el:sec, focusEl:h2, tick(dt){ if(playing){ t+=dt; drawWave(); } } };
}

/* ---------------- Type: read the graph ---------------- */
function buildReadQ(q,i){

  let d=""; const N=500;
  for(let n=0;n<=N;n++){ const x=q.xMax*n/N; d+=(n?"L":"M")+P.X(x).toFixed(1)+","+P.Y(q.fn(x)).toFixed(1); }
  const path=S("path",{d,fill:"none","stroke-width":3.5,"stroke-linejoin":"round"},svg); path.style.stroke="var("+q.color+")";
  fig.append(svg);
  sec.append(gl,fig);
  const det=H("details",{class:"data"});
  det.append(H("summary",{text:"Show the graph as a data table"}));
  const tw=H("div",{class:"tablewrap",tabindex:"0","aria-label":"Data table, scrollable"});
  tw.append(dataTable(q,q.fn,q.xStep,"Values read from the graph at each vertical grid line.",Math.max(0,Math.ceil(-Math.log10(q.yStep))+1)));
  det.append(tw); sec.append(det);

  sec.append(H("p",{class:"help",html:"Type numbers only; the unit is shown next to each box. For powers of ten, type <kbd>2.5e9</kbd> or <kbd>2.5x10^9</kbd>. Answers within 3% count as correct. Each check of all four boxes uses one attempt."}));
  const fields=H("div",{class:"fields"});
  const inputs={};
  q.fields.forEach(f=>{
    const id=q.id+"-"+f.key, uid=id+"-u", rid=id+"-r";
    const inp=H("input",{type:"text",id,inputmode:"decimal",autocomplete:"off",spellcheck:"false","aria-describedby":uid+" "+rid});
    const res=H("div",{class:"fres",id:rid});
    const wrap=H("div",{class:"field"},
      H("label",{for:id,text:f.label}),
      H("div",{class:"inrow"}, inp, H("span",{class:"unit",id:uid},H("span",{class:"sr-only",text:"in "}),document.createTextNode(f.unit))),
      res);
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); check(); } });
    inputs[f.key]={inp,res,wrap,f};
    fields.append(wrap);
  });
  sec.append(fields);
  const checkBtn=H("button",{type:"button",class:"primary",text:"Check my answers"});
  const hintBtn=H("button",{type:"button","aria-expanded":"false","aria-controls":q.id+"-hint",text:"Show a hint"});
  const hint=H("div",{class:"feedback part",id:q.id+"-hint",hidden:""});
  hint.append(H("strong",{text:"Hint"}), document.createTextNode("Amplitude: rest line to a crest. Wavelength: crest to the next crest. Then f = v ÷ λ (with λ in meters) and T = 1 ÷ f."));
  hintBtn.addEventListener("click",()=>{ const open=hint.hidden; hint.hidden=!open; hintBtn.setAttribute("aria-expanded",String(open)); hintBtn.textContent=open?"Hide the hint":"Show a hint"; });
  sec.append(H("div",{class:"controls"},checkBtn,hintBtn), att.info, hint);
  const fb=H("div",{class:"feedback",role:"status","aria-live":"polite"});
  sec.append(fb, att.reveal, pager(i));

  const fA=q.fields[0], fL=q.fields[1], fF=q.fields[2], fT=q.fields[3];
  const lamM=fL.ans*fL.toMeters;
  function lock(){
    checkBtn.disabled=true;
    for(const k in inputs) inputs[k].inp.disabled=true;
    const tbl=H("table",null,
      H("caption",{text:"Correct values"}),
      H("thead",null,H("tr",null,H("th",{scope:"col",text:"Quantity"}),H("th",{scope:"col",text:"Value"}))),
      H("tbody",null, ...q.fields.map(f=>H("tr",null,H("td",{style:"text-align:left",text:f.label}),H("td",{text:nice(f.ans)+" "+f.unit})))));
    att.show([
      H("div",{class:"tablewrap",style:"max-width:360px;margin-bottom:8px"},tbl),
      "Amplitude: the height of a crest above the zero line is "+nice(fA.ans)+" "+fA.unit+".",
      "Wavelength: the distance from one crest to the next crest is "+nice(fL.ans)+" "+fL.unit+(fL.toMeters!==1?", which is "+nice(lamM)+" m":"")+".",
      "Frequency: f = v ÷ λ = "+nice(q.v)+" m/s ÷ "+nice(lamM)+" m = "+nice(fF.ans)+" Hz.",
      "Period: T = 1 ÷ f = 1 ÷ "+nice(fF.ans)+" Hz = "+nice(fT.ans)+" s."
    ]);
  }
  const tol=0.03;
  function check(){
    if(att.locked) return;
    const val={}; let anyEmpty=false;
    for(const k in inputs){ val[k]=parseNum(inputs[k].inp.value); if(inputs[k].inp.value.trim()==="") anyEmpty=true; }
    if(anyEmpty){ setFeedback(fb,"bad","Fill in all four boxes first.","This didn’t use an attempt."); return; }
    const lamUserM=isFinite(val.lambda)? val.lambda*fL.toMeters : NaN;
    const fUser=val.f;
    let nOK=0;
    for(const k in inputs){
      const {inp,res,wrap,f}=inputs[k]; const v=val[k];
      let ok=false, msg="";
      if(!isFinite(v)) msg="That isn’t a number. Example formats: 0.25, 2.5e9, 2.5x10^9.";
      else if(near(v,f.ans,tol)){ ok=true; msg="Correct."; }
      else if(k==="A"){
        msg= near(v,2*f.ans,tol) ? "That’s the crest-to-trough height. Measure from the zero line instead." : "Read how high a crest rises above the zero line.";
      } else if(k==="lambda"){
        if(near(v,f.ans/2,tol)) msg="That’s half a wavelength (crest to trough). Measure crest to the next crest.";
        else if(near(v,2*f.ans,tol)) msg="That spans two wavelengths. Measure from one crest to the very next crest.";
        else if(f.toMeters!==1 && near(v,f.ans*f.toMeters,tol)) msg="Enter this one in "+f.unit+", the unit shown next to the box.";
        else msg="Find two neighboring crests and read the distance between them.";
      } else if(k==="f"){
        if(fL.toMeters!==1 && near(v,q.v/fL.ans,tol)) msg="You divided by the wavelength in "+fL.unit+". Convert it to meters first.";
        else if(near(v,lamM/q.v,tol)) msg="That’s λ ÷ v, which gives the period. Frequency is f = v ÷ λ.";
        else if(near(v,q.v*lamM,tol)) msg="Divide instead of multiplying: f = v ÷ λ.";
        else if(isFinite(lamUserM) && lamUserM>0 && near(v,q.v/lamUserM,tol)) msg="Your method is right, but it uses your wavelength. Fix the wavelength first.";
        else msg="Use f = v ÷ λ, with the speed given and the wavelength in meters.";
      } else if(k==="T"){
        if(near(v,1/f.ans,tol)) msg="That’s the frequency. The period is T = 1 ÷ f.";
        else if(isFinite(fUser) && fUser>0 && near(v,1/fUser,tol)) msg="Your method is right, but it uses your frequency. Fix the frequency first.";
        else msg="Use T = 1 ÷ f (or T = λ ÷ v, with λ in meters).";
      }
      res.className="fres "+(ok?"ok":"bad");
      res.textContent=(ok?"✓ ":"✗ ")+msg;
      wrap.classList.toggle("is-ok",ok); wrap.classList.toggle("is-bad",!ok);
      inp.setAttribute("aria-invalid", String(!ok));
      if(ok) nOK++;
    }
    const success=nOK===4;
    const locked=att.record(success, nOK);
    if(success) setFeedback(fb,"ok","✓ All four are correct.","Well done. See the worked solution below.");
    else setFeedback(fb, nOK>0?"part":"bad", nOK+" of 4 correct.", locked? LAST.trim() : "Read the note under each box marked ✗ and fix it."+retryText(att));
    if(locked) lock();
  }
  checkBtn.addEventListener("click",check);
  if(att.locked) lock();
  return { el:sec, focusEl:h2, tick(){} };
}

  S("line",{x1,x2,y1:y,y2:y,style:"stroke:var(--ink)","stroke-width":2.5,"marker-end":`url(#${id})`},svg);
  const t=S("text",{x:x1-10,y:y+5,"text-anchor":"end","font-size":16,style:"fill:var(--ink)"},svg); t.textContent=label;
}

  const checkBtn=H("button",{type:"button",class:"primary",text:"Check my match"});
  sec.append(H("div",{class:"controls"},checkBtn,hearBtn), att.info);
  sec.append(H("p",{class:"help",text:"The sound button is optional: higher frequency sounds higher in pitch, and bigger amplitude sounds louder. Use headphones or low volume in class."}));
  const fb=H("div",{class:"feedback",role:"status","aria-live":"polite"});
  sec.append(fb, att.reveal, pager(i));
  function lock(){
    checkBtn.disabled=true; sA.inp.disabled=true; sF.inp.disabled=true;
    att.show([
      H("p",{class:"ans",text:"Target settings: amplitude "+q.targetA+" mm and frequency "+q.targetF+" Hz."}),
      "Amplitude: the target’s crests rise "+q.targetA+" mm above the zero line.",
      "Wavelength: crests repeat every "+trimNum(lamT)+" m on the grid, so λ = "+trimNum(lamT)+" m.",
      "Frequency: f = v ÷ λ = "+q.v+" m/s ÷ "+trimNum(lamT)+" m = "+q.targetF+" Hz. Raising the frequency would make the wavelength shorter, and lowering it would make the wavelength longer."
    ]);
  }
  checkBtn.addEventListener("click",()=>{
    if(att.locked) return;
    const A=+sA.inp.value, f=+sF.inp.value;
    const aOK=Math.abs(A-q.targetA)<1e-6, fOK=f===q.targetF;
    const parts=[];
    parts.push(aOK? "✓ Amplitude matches." : "✗ Amplitude: your crests are too "+(A>q.targetA?"tall.":"short."));
    parts.push(fOK? "✓ Frequency matches." : "✗ Frequency: your wavelength is too "+(f>q.targetF?"short, so the frequency is too high.":"long, so the frequency is too low."));
    const earned=(aOK?1:0)+(fOK?1:0), success=earned===2;
    const locked=att.record(success, earned);
    if(success) setFeedback(fb,"ok","✓ Perfect match.","See the explanation below.");
    else setFeedback(fb, earned?"part":"bad", earned+" of 2 correct.", parts.join(" ")+(locked?LAST:retryText(att)));
    if(locked) lock();
  });
  if(att.locked) lock();
  return { el:sec, focusEl:h2, tick(){} };
}

/* ---------------- Start screen ---------------- */
function buildStart(){
  const sec=H("section",{class:"card start","aria-labelledby":"start-h"});
  const h2=H("h2",{class:"qtitle",id:"start-h",tabindex:"-1",text:"Before you begin"});
  sec.append(h2, H("p",{class:"intro",text:"Type your name. If you are working with a partner, type both names. Your names will appear on your results card at the end of the activity."}));
  const form=H("form",{novalidate:""});
  const n1=H("input",{type:"text",id:"name1",autocomplete:"name",maxlength:"40","aria-describedby":"name1-err",value:team.names[0]});
  const err=H("p",{class:"err",id:"name1-err","aria-live":"polite"});
  const n2=H("input",{type:"text",id:"name2",maxlength:"40",value:team.names[1]});
  form.append(
    H("div",{class:"namefield"},H("label",{for:"name1",text:"Student 1 name"}),n1,err),
    H("div",{class:"namefield"},H("label",{for:"name2"},document.createTextNode("Student 2 name "),H("span",{class:"opt",text:"(leave blank if working alone)"})),n2),
    H("button",{type:"submit",class:"primary",text:team.names[0]?"Save names and continue":"Start the activity"}));
  form.addEventListener("submit",e=>{
    e.preventDefault();
    const a=n1.value.trim(), b=n2.value.trim();
    if(!a){ err.textContent="Enter at least one name to start."; n1.setAttribute("aria-invalid","true"); n1.focus(); return; }
    n1.removeAttribute("aria-invalid"); err.textContent="";
    team.names=[a,b]; save(); updateTeamLine();
    const firstOpen=QUESTIONS.find(q=>!state[q.id].locked);
    const target="#"+(firstOpen?firstOpen.id:"summary");
    if(location.hash===target) route(false); else location.hash=target;
  });
  sec.append(form);
  sec.append(H("ul",{class:"rules"},
    H("li",{text:QUESTIONS.length+" questions, each worth "+PTS+" points ("+(QUESTIONS.length*PTS)+" points in total)."}),
    H("li",{text:"You get "+MAX_TRIES+" attempts on each question."}),
    H("li",{text:"The answer and its explanation appear once you get the question right or after your third attempt."}),
    H("li",{text:"Your progress is saved in this browser, so you can come back to it on the same device."})));
  return { el:sec, focusEl:n1, title:"Before you begin", tick(){} };
}

/* ---------------- Results card ---------------- */
function buildSummary(){
  const wrap=H("div");
  let earned=0, solved=0, first=0, done=0;
  const max=QUESTIONS.length*PTS;
  const todo=[];
  QUESTIONS.forEach((q,i)=>{ const s=state[q.id]; earned+=PTS*s.earned/s.max; if(s.locked) done++; else todo.push({q,i}); if(s.success){ solved++; if(s.tries===1) first++; } });
  const complete=todo.length===0;
  const pct=earned/max;
  const card=H("section",{class:"card celebrate","aria-labelledby":"sum-h"});
  if(complete){
    const conf=H("div",{class:"confetti","aria-hidden":"true"});
    const cols=["var(--wave)","var(--sound)","var(--mark)","var(--ok)"];
    for(let n=0;n<36;n++){ const c=H("i"); c.style.left=(Math.random()*100)+"%"; c.style.background=cols[n%4]; c.style.animationDelay=(Math.random()*0.9).toFixed(2)+"s"; conf.append(c); }
    card.append(conf);
  }
  const who=namesText();
  const h2=H("h2",{id:"sum-h",tabindex:"-1",text: complete? "Well done, "+who+"!" : "Keep going, "+who+"!"});
  let msg;
  if(!complete) msg="You have finished "+done+" of "+QUESTIONS.length+" questions. Finish the rest to complete your card.";
  else if(pct>=0.9) msg="Outstanding work. You clearly understand how light and sound waves behave.";
  else if(pct>=0.75) msg="Great work. Look back at the explanations for any question you missed.";
  else if(pct>=0.5) msg="Good effort. Review the explanations, especially for the questions you didn’t solve.";
  else msg="You made it through the whole activity. Go back over the explanations and try a similar problem set again.";
  const today=new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
  card.append(
    H("p",{class:"kicker",text: complete? "PHY 1020, Activity 19: Waves, light and sound, complete" : "PHY 1020, Activity 19: Waves, light and sound, in progress"}),
    h2,
    S("svg",{class:"cwave",viewBox:"0 0 520 34","aria-hidden":"true",focusable:"false"}),
    H("p",{class:"bigscore",text:fmtPts(earned)}),
    H("p",{class:"outof",text:"out of "+max+" points"}),
    H("p",{class:"msg",text:msg}),
    H("div",{class:"stats"},
      H("div",{class:"stat"},H("b",{text:solved+" of "+QUESTIONS.length}),H("span",{text:"questions solved"})),
      H("div",{class:"stat"},H("b",{text:String(first)}),H("span",{text:"solved on the first attempt"}))),
    H("p",{class:"date",text:today}));
  const cw=card.querySelector(".cwave");
  S("path",{d:"M4 17 C 30 -3, 56 -3, 82 17 S 134 37, 160 17 S 212 -3, 238 17 S 290 37, 316 17",style:"stroke:var(--wave)"},cw);
  S("path",{d:"M316 17 C 326 7, 336 7, 346 17 S 366 27, 376 17 S 396 7, 406 17 S 426 27, 436 17 S 456 7, 466 17 S 486 27, 496 17 S 510 9, 516 17",style:"stroke:var(--sound)"},cw);
  if(!complete){
    const ul=H("ul");
    todo.forEach(({q,i})=>ul.append(H("li",null,H("a",{href:"#"+q.id,text:"Question "+(i+1)+": "+q.short}))));
    card.append(H("div",{class:"todo"},H("p",{class:"ans",text:"Still to finish:"}),ul));
  } else {
    card.append(H("p",{class:"help",style:"margin:12px auto 0",text:"Take a screenshot of this card to show your instructor."}));
  }
  wrap.append(card);

  const det=H("section",{class:"card","aria-labelledby":"det-h"});
  const tb=H("tbody");
  QUESTIONS.forEach((q,i)=>{
    const s=state[q.id];
    const stTxt= s.locked ? (s.success? "Solved on attempt "+s.tries : "Answer shown after "+MAX_TRIES+" attempts") : (s.tries? triesWord(MAX_TRIES-s.tries)+" left" : "Not answered");
    tb.append(H("tr",null, H("td",null,H("a",{href:"#"+q.id,text:(i+1)+". "+q.short})), H("td",{text:stTxt}), H("td",{text:fmtPts(PTS*s.earned/s.max)+" / "+PTS})));
  });
  const tbl=H("table",{class:"summary-table"},
    H("caption",{text:"Points for each question. Questions with several parts give partial credit: each part earns an equal share of the 5 points."}),
    H("thead",null,H("tr",null,H("th",{scope:"col",text:"Question"}),H("th",{scope:"col",text:"Status"}),H("th",{scope:"col",text:"Points"}))),
    tb);
  const reset=H("button",{type:"button",text:"Start over with new names"});
  reset.addEventListener("click",()=>{
    if(!confirm("This clears all answers, attempts and names on this device. Start over?")) return;
    freshState(); team.names=["",""];
    try{ localStorage.removeItem(STORE); }catch(e){}
    for(const k in views) delete views[k];
    buildNav(); updateTeamLine();
    if(location.hash==="#start") route(false); else location.hash="#start";
  });
  det.append(H("h2",{class:"qtitle",id:"det-h",text:"Question by question"}), H("div",{class:"tablewrap",style:"max-height:none"},tbl), H("div",{class:"controls",style:"margin-top:16px"},reset));
  wrap.append(det);
  return { el:wrap, focusEl:h2, tick(){} };
}

/* ---------------- Router + loop ---------------- */
let active=null;
const builders={arrow:buildArrowQ, read:buildReadQ, kind:buildKindQ, tf:buildTFQ, who:buildWhoQ, rank:buildRankQ, fill:buildFillQ, match:buildMatchQ};
function route(initial){
  const h=(location.hash||"").slice(1);
  let id = (h==="summary"||h==="start") ? h : (QUESTIONS.some(q=>q.id===h)? h : null);
  if(!team.names[0]) id="start";
  else if(!id) id=QUESTIONS[0].id;
  current=id;
  let v;
  if(id==="start") v=buildStart();
  else if(id==="summary") v=buildSummary();
  else {
    if(!views[id]){ const i=QUESTIONS.findIndex(q=>q.id===id), q=QUESTIONS[i]; views[id]=builders[q.type](q,i); }
    v=views[id];
  }
  stage.replaceChildren(v.el);
  active=v; markCurrent();
  document.title=(v.title||v.focusEl.textContent)+" — Waves practice";
  if(!initial || id==="start"){ v.focusEl.focus({preventScroll:true}); if(!initial) v.el.scrollIntoView({block:"start"}); }
}
window.addEventListener("hashchange",()=>route(false));
buildNav(); updateTeamLine(); route(true);

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(active && !document.hidden) active.tick(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();

</script>
